name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fetch-upstream:
    name: Fetch & verify upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache upstream tarballs
        uses: actions/cache@v4
        with:
          path: upstream/cache
          key: upstream-${{ hashFiles('upstream/checksums.sha256') }}
          restore-keys: upstream-

      - name: Fetch canonical upstream sources
        run: bash scripts/fetch-upstream.sh --no-extract

      - name: Upload GrADS source tarball
        uses: actions/upload-artifact@v4
        with:
          name: grads-2.2.1-tarball
          path: upstream/cache/grads-2.2.1-src.tar.gz
          retention-days: 1

  verify-structure:
    name: Verify upstream structure
    runs-on: ubuntu-latest
    needs: fetch-upstream
    steps:
      - uses: actions/checkout@v4

      - name: Download GrADS source tarball
        uses: actions/download-artifact@v4
        with:
          name: grads-2.2.1-tarball
          path: upstream/cache

      - name: Extract and verify source tree
        run: |
          mkdir -p upstream/src
          tar -xf upstream/cache/grads-2.2.1-src.tar.gz -C upstream/src

          # Assert key upstream files exist
          src_root="$(find upstream/src -maxdepth 1 -mindepth 1 -type d | head -1)"
          echo "Extracted source root: $src_root"
          for f in configure.ac src/grads.c; do
            if [[ ! -f "$src_root/$f" ]]; then
              echo "MISSING: $src_root/$f" >&2
              exit 1
            fi
            echo "found: $f"
          done

          # Print upstream version as smoke test
          version=$(grep -E '^AC_INIT' "$src_root/configure.ac" | head -1)
          echo "Upstream version line: $version"

  cmake-build:
    name: CMake build (Linux)
    runs-on: ubuntu-latest
    needs: fetch-upstream
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config \
            libgd-dev libcairo2-dev libreadline-dev \
            libnetcdf-dev libhdf5-dev libhdf4-alt-dev \
            libshp-dev libgeotiff-dev libpng-dev zlib1g-dev

      - name: Configure (headless, no OPeNDAP)
        run: |
          cmake -B grads-2.2.1/build grads-2.2.1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_GUI=OFF \
            -DENABLE_HEADLESS=ON \
            -DENABLE_DAP=OFF \
            -DENABLE_GADAP=OFF

      - name: Build
        run: cmake --build grads-2.2.1/build -j$(nproc)

      - name: Smoke test
        run: |
          ./grads-2.2.1/build/grads -help | grep -q "GrADS version 2.2.1"
          echo "Smoke test passed: grads -help reports version 2.2.1"

  ng-unit:
    name: GrADS-NG unit tests (no network data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential

      - name: Configure and build ng
        run: |
          cmake -B ng/build -S ng -DCMAKE_BUILD_TYPE=Release
          cmake --build ng/build -j$(nproc)

      - name: Fast unit tests (external data excluded)
        run: ctest --test-dir ng/build -LE external-data --output-on-failure

  ng-nclimgrid:
    name: GrADS-NG nClimGrid-Daily suite (external data)
    runs-on: ubuntu-latest
    needs: ng-unit
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential python3-pip

      - name: Install NetCDF readers
        run: pip3 install --user netCDF4 numpy

      - name: Cache nClimGrid fixture
        uses: actions/cache@v4
        with:
          path: ~/.cache/grads-ng-test-data
          key: nclimgrid-${{ hashFiles('ng/tests/integration/nclimgrid/fixture.conf') }}
          restore-keys: nclimgrid-

      - name: Acquire fixture
        run: bash ng/tests/integration/nclimgrid/download-nclimgrid-test-data.sh

      - name: Configure and build ng
        run: |
          cmake -B ng/build -S ng -DCMAKE_BUILD_TYPE=Release
          cmake --build ng/build -j$(nproc)

      - name: nClimGrid suite (reference arm skips without REF_GRADS_BIN)
        run: ctest --test-dir ng/build -L nclimgrid --output-on-failure
